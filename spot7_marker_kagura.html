<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スポット7 マーカーAR 庄内神楽</title>

<!-- A-Frame と MindAR の読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  
  /* カメラ映像が見えるよう背景を強力に透明化 */
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: transparent !important;
    background-color: transparent !important;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }

  a-scene {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
    background: transparent !important;
  }

  video {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: -1 !important;
  }

  .screen { position:fixed; top:0; left:0; width:100%; height:100%; display:none; }
  .screen.show { display:flex; }

  #searchHint {
    position:fixed; bottom:0; left:0; width:100%; z-index:20;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none;
  }
  #searchHint .badge {
    display:inline-block; background: rgba(0,0,0,0.4);
    border:2px solid rgba(255,255,255,0.6); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:20;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:2px; }

  /* ---- クイズ画面（すりガラス風・半透明） ---- */
  #quizScreen {
    background: rgba(20,10,8,0.75); z-index:30;
    backdrop-filter: blur(4px);
    flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #quizScreen h2 { font-size:20px; margin-bottom:20px; font-weight:800; line-height:1.6; }
  #choices { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .choiceBtn {
    background:#fff; color:#5a2a1a; border:3px solid #fff; border-radius:20px;
    padding:16px; font-size:17px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .choiceBtn.wrong { background:#ffd9d9; border-color:#ff8a8a; }
  .choiceBtn.correct { background:#d6f5e0; border-color:#3fbf7f; }
  #quizFeedback { margin-top:14px; font-size:15px; min-height:22px; font-weight:700; }

  /* ---- 完了画面 ---- */
  #clearScreen {
    background: rgba(28, 94, 63, 0.9); z-index:33;
    flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  .stamp {
    width:130px; height:130px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:22px;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  #clearScreen h2 { font-size:24px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
</style>
</head>
<body>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット7・庄内神楽</p>
</div>

<div id="searchHint">
  <div class="badge">印刷したマーカーに カメラを むけてね</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./kagura.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<!-- ① クイズ画面（元々の問題文に修正） -->
<div id="quizScreen" class="screen">
  <h2>もんだい：<br>由布市が ゆうめいな のは<br>つぎの うち どれ？</h2>
  <div id="choices">
    <button class="choiceBtn" data-val="onsen">おんせん</button>
    <button class="choiceBtn" data-val="umi">うみ</button>
    <button class="choiceBtn" data-val="yuki">ゆきまつり</button>
  </div>
  <div id="quizFeedback"></div>
</div>

<!-- ② 完了画面 -->
<div id="clearScreen" class="screen">
  <div class="stamp">🎭</div>
  <h2>スタンプ げっと!</h2>
  <p>庄内神楽の スタンプを<br>手に入れたよ！</p>
</div>

<script>
const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const quizScreen = document.getElementById('quizScreen');
const clearScreen = document.getElementById('clearScreen');
const choices = document.getElementById('choices');
const quizFeedback = document.getElementById('quizFeedback');

let gameStarted = false;
let answered = false;

function showScreen(el){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  el.classList.add('show');
}

// ---- マーカー検出 ----
targetEntity.addEventListener('targetFound', () => {
  searchHint.style.display = 'none';
  if (!gameStarted){
    gameStarted = true;
    showScreen(quizScreen);
  }
});
targetEntity.addEventListener('targetLost', () => {
  if (!gameStarted) searchHint.style.display = 'block';
});

// ---- ① クイズ（正解判定も元の「onsen」に変更） ----
choices.addEventListener('click', (e)=>{
  const btn = e.target.closest('.choiceBtn');
  if (!btn || answered) return;
  if (btn.dataset.val === 'onsen'){
    answered = true;
    btn.classList.add('correct');
    quizFeedback.textContent = 'せいかい!';
    setTimeout(()=> showScreen(clearScreen), 700);
  } else {
    btn.classList.add('wrong');
    quizFeedback.textContent = 'ちがうよ、もういちど かんがえてみよう';
    setTimeout(()=> btn.classList.remove('wrong'), 700);
  }
});
</script>
</body>
</html>
