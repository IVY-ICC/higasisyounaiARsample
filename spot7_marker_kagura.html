<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット7 マーカーAR 3にんの ならびかえ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }

  a-scene { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }

  #searchHint {
    position:fixed; bottom:0; left:0; width:100%; z-index:20;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none;
  }
  #searchHint .badge {
    display:inline-block; background: rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.4); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:20;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:2px; }

  #gameLayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
    display: none;
    pointer-events: none;
  }

  #clueBox {
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    z-index:101; width:92%; max-width:400px; display:none;
    background:rgba(255,255,255,0.95); color:#3a2410; border-radius:16px;
    padding:14px 18px; text-align:center; font-weight:700; font-size:14px;
    line-height:1.8; box-shadow:0 6px 20px rgba(0,0,0,0.3);
    pointer-events: auto;
  }

  #slotsArea { position:fixed; top:0; left:0; width:100%; height:100%; z-index:101; display:none; pointer-events:none; }
  .slot {
    position:absolute; width:26vw; max-width:130px; height:26vw; max-height:130px;
    border:3px dashed rgba(255,255,255,0.6); border-radius:16px;
    background:rgba(255,255,255,0.08);
  }
  .slotLabel {
    position:absolute; top:-26px; left:0; width:100%; text-align:center;
    color:#fff; font-size:12px; font-weight:700; opacity:0.85;
  }

  .card {
    position:absolute; width:24vw; max-width:120px; height:24vw; max-height:120px;
    border-radius:14px; background:rgba(255,255,255,0.95);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    touch-action:none; z-index:105;
    pointer-events: auto;
  }
  .card img { width:82%; height:82%; object-fit:contain; pointer-events:none; }
  .card.correct { box-shadow:0 0 0 4px #3fbf7f, 0 6px 16px rgba(0,0,0,0.35); }

  #checkBtn {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:102; display:none;
    background:#fff; color:#3a2410; border:none; border-radius:30px;
    padding:14px 36px; font-size:16px; font-weight:800;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    pointer-events: auto;
  }

  #hint {
    position:fixed; bottom:100px; left:0; width:100%; z-index:101;
    padding: 10px; color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(255,255,255,0.2);
    border:2px solid rgba(255,255,255,0.45); border-radius:24px;
    padding:8px 18px; font-size:14px; font-weight:600; backdrop-filter: blur(6px);
  }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #2b8a5f, #1c5e3f); z-index:200;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
    pointer-events: auto;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp { width:130px; height:130px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:22px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #clearScreen h2 { font-size:24px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:300px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット7・庄内神楽</p>
</div>

<div id="searchHint">
  <div class="badge">印刷したマーカーに カメラを むけてね</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./kagura.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<div id="gameLayer"></div>

<div id="clueBox">
  おろちくんは、みことくんの みぎに いないよ。<br>
  ひめちゃんは、いちばん ひだりに いないよ。<br>
  大蛇(おろち)を たいじする かみさま(みことくん)は、<br>
  まんなかに たつよ。
</div>

<div id="slotsArea">
  <div class="slot" id="slotL"><div class="slotLabel">ひだり</div></div>
  <div class="slot" id="slotC"><div class="slotLabel">まんなか</div></div>
  <div class="slot" id="slotR"><div class="slotLabel">みぎ</div></div>
</div>

<div id="hint">
  <div class="badge" id="hintText">カードを ゆびで ドラッグして うごかそう</div>
</div>

<button id="checkBtn">これで けってい!</button>

<div id="clearScreen">
  <div class="stamp">⛩️</div>
  <h2>せいかい!</h2>
  <p id="clearText"></p>
</div>

<script>
const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const gameLayer = document.getElementById('gameLayer');
const clueBox = document.getElementById('clueBox');
const slotsArea = document.getElementById('slotsArea');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const checkBtn = document.getElementById('checkBtn');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

const CHARACTERS = [
  { id:'orochi', name:'おろちくん', img:'char_orochi.png', correctSlot:'L' },
  { id:'mikoto', name:'みことくん', img:'char_mikoto.png', correctSlot:'C' },
  { id:'hime',   name:'ひめちゃん', img:'char_hime.png',   correctSlot:'R' },
];

let cards = [];
let cleared = false;
let gameStarted = false;

function setupGame(){
  const shuffled = [...CHARACTERS].sort(()=>Math.random()-0.5);
  const W = window.innerWidth, H = window.innerHeight;
  const startY = H*0.62;
  const positions = [W*0.18, W*0.5, W*0.82];

  shuffled.forEach((ch, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = ch.id;
    card.style.left = (positions[i] - 60) + 'px';
    card.style.top = startY + 'px';

    const img = document.createElement('img');
    img.src = ch.img;
    card.appendChild(img);
    gameLayer.appendChild(card);
    cards.push(card);

    makeDraggable(card);
  });
}

function makeDraggable(card){
  let dragging = false;
  let offsetX = 0, offsetY = 0;

  function start(x, y){
    dragging = true;
    const rect = card.getBoundingClientRect();
    offsetX = x - rect.left;
    offsetY = y - rect.top;
    card.style.zIndex = 999;
  }
  function move(x, y){
    if (!dragging) return;
    card.style.left = (x - offsetX) + 'px';
    card.style.top = (y - offsetY) + 'px';
  }
  function end(){
    if (!dragging) return;
    dragging = false;
    card.style.zIndex = 105;
    snapToNearestSlot(card);
  }

  // スマホ用タッチイベント（スクロールを完全無効化）
  card.addEventListener('touchstart', e => {
    const t = e.touches[0];
    start(t.clientX, t.clientY);
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    if (e.cancelable) e.preventDefault(); // スクロール防止
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: false });

  card.addEventListener('touchend', end);

  // PC用マウスイベント
  card.addEventListener('mousedown', e => { start(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);
}

function snapToNearestSlot(card){
  const slots = [document.getElementById('slotL'), document.getElementById('slotC'), document.getElementById('slotR')];
  const cardRect = card.getBoundingClientRect();
  const cx = cardRect.left + cardRect.width/2;
  const cy = cardRect.top + cardRect.height/2;

  let nearest = null, nearestDist = Infinity;
  slots.forEach(slot=>{
    const r = slot.getBoundingClientRect();
    const sx = r.left + r.width/2, sy = r.top + r.height/2;
    const d = Math.hypot(cx-sx, cy-sy);
    if (d < nearestDist){ nearestDist = d; nearest = slot; }
  });

  if (nearest && nearestDist < 140){
    const occupied = cards.find(c => c!==card && c.dataset.slot === nearest.id);
    if (occupied){ occupied.dataset.slot = ''; }
    card.dataset.slot = nearest.id;
    const r = nearest.getBoundingClientRect();
    card.style.left = (r.left + r.width/2 - cardRect.width/2) + 'px';
    card.style.top = (r.top + r.height/2 - cardRect.height/2) + 'px';
  } else {
    card.dataset.slot = '';
  }
}

checkBtn.addEventListener('click', ()=>{
  if (cleared) return;
  const slotMap = { slotL:'L', slotC:'C', slotR:'R' };
  let allPlaced = true;
  let allCorrect = true;

  cards.forEach(card=>{
    const slotId = card.dataset.slot;
    if (!slotId){ allPlaced = false; return; }
    const ch = CHARACTERS.find(c => c.id === card.dataset.id);
    const placedSlotLetter = slotMap[slotId];
    if (placedSlotLetter === ch.correctSlot){
      card.classList.add('correct');
    } else {
      card.classList.remove('correct');
      allCorrect = false;
    }
  });

  if (!allPlaced){
    hintText.textContent = '3にん ぜんいん、わくの なかに いれてね';
    return;
  }

  if (allCorrect){
    cleared = true;
    hintText.textContent = 'せいかい!';
    setTimeout(()=>{
      clearText.innerHTML = '庄内神楽(しょうないかぐら)では、<br>大蛇(おろち)を たいじする お話が えんじられるよ。<br>ひだりから おろちくん・みことくん・ひめちゃんの じゅんばん、<br>おぼえたかな?';
      clearScreen.classList.add('show');
    }, 700);
  } else {
    hintText.textContent = 'ちがう じゅんばんみたい。もういちど ヒントを よもう';
  }
});

targetEntity.addEventListener('targetFound', () => {
  searchHint.style.display = 'none';
  if (!gameStarted){
    gameStarted = true;
    // 1. ゲームレイヤーを表示し、タッチイベントを有効化する
    gameLayer.style.display = 'block';
    gameLayer.style.pointerEvents = 'auto';
    
    clueBox.style.display = 'block';
    slotsArea.style.display = 'block';
    hint.style.display = 'block';
    checkBtn.style.display = 'block';

    // 2. 表示されてからカードをセットアップする
    setupGame();
  }
});

targetEntity.addEventListener('targetLost', () => {
  if (!gameStarted) searchHint.style.display = 'block';
});
</script>
</body>
</html>
