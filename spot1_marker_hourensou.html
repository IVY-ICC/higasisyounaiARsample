<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット1 マーカーAR ほうれんそうばたけ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background: transparent !important;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }

  /* MindARのカメラ映像＋3D描画レイヤーはそのまま背景として使う */
  a-scene { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; background: transparent !important; }
  video {
    position: fixed !important; top:0 !important; left:0 !important;
    width:100% !important; height:100% !important;
    object-fit: cover !important; z-index:-1 !important;
  }

  /* ---- マーカー未検出時の案内 ---- */
  #searchHint {
    position:fixed; bottom:0; left:0; width:100%; z-index:20;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none;
  }
  #searchHint .badge {
    display:inline-block; background: rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.4); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:20;
    padding: 16px 18px; padding-top: max(16px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:4px; }

  /* ---- ゲーム用オーバーレイ（マーカー検出後に表示） ---- */
  #gameLayer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:30; display:none; }
  #gameCanvas { position:fixed; top:0; left:0; width:100%; height:100%; touch-action:none; }

  #questionBox {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    z-index:31; width:90%; max-width:380px; display:none;
    background:rgba(255,255,255,0.95); color:#1f3a24; border-radius:18px;
    padding:16px 18px; text-align:center; font-weight:700; font-size:17px;
    line-height:1.6; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }
  #pullCount { color:#2e8b47; font-size:20px; }

  #hint {
    position:fixed; bottom:0; left:0; width:100%; z-index:31;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.4); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #choices {
    position:fixed; bottom:0; left:0; width:100%; z-index:32;
    padding: 18px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    display:none; gap:12px; flex-direction:column;
    background: linear-gradient(transparent, rgba(0,0,0,0.75) 30%);
  }
  #choices.show { display:flex; }
  .choiceBtn {
    background:#fff; color:#1f3a24; border:3px solid #fff; border-radius:20px;
    padding:16px; font-size:19px; font-weight:800;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .choiceBtn.wrong { background:#ffe3e3; border-color:#ff8a8a; }
  .choiceBtn.correct { background:#d6f5e0; border-color:#3fbf7f; }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #2b8a5f, #1c5e3f); z-index:40;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp {
    width:140px; height:140px; border-radius:50%;
    background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:64px; margin-bottom:22px;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  #clearScreen h2 { font-size:26px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット1・ほうれんそうばたけ</p>
</div>

<div id="searchHint">
  <div class="badge">印刷したマーカーに カメラを むけてね</div>
</div>

<!-- MindARのカメラ映像＋マーカー認識 -->
<a-scene
  mindar-image="imageTargetSrc: ./hourenso.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<!-- マーカー検出後に表示するゲーム画面 -->
<div id="gameLayer">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="questionBox">
  ほうれんそうを 3束 しゅうかくしよう。<br>
  3束 ゆびで ひっぱって ぬいてみよう!<br>
  <span id="pullCount">ぬいた数：0 / 3</span>
</div>

<div id="hint">
  <div class="badge" id="hintText">ほうれんそうを タップして ひっぱろう</div>
</div>

<div id="choices">
  <button class="choiceBtn" data-val="6">6つ</button>
  <button class="choiceBtn" data-val="3">3つ</button>
  <button class="choiceBtn" data-val="9">9つ</button>
</div>

<div id="clearScreen">
  <div class="stamp">🥬</div>
  <h2>せいかい!</h2>
  <p id="clearText"></p>
</div>

const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const gameLayer = document.getElementById('gameLayer');
const questionBox = document.getElementById('questionBox');
const hint = document.getElementById('hint');

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hintText = document.getElementById('hintText');
const pullCountEl = document.getElementById('pullCount');
const choicesBox = document.getElementById('choices');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

let W, H;
let plants = [];
let pulledCount = 0;
const PULL_TARGET = 3;
let phase = 'pulling';
let answered = false;
let gameStarted = false;
let loopRunning = false;

// ---- ほうれん草画像の生成（黒背景を自動背景透過処理） ----
const rawImg = new Image();
const plantCanvas = document.createElement('canvas');
const plantCtx = plantCanvas.getContext('2d');
let plantImgLoaded = false;

rawImg.onload = () => {
  plantCanvas.width = rawImg.width;
  plantCanvas.height = rawImg.height;
  plantCtx.drawImage(rawImg, 0, 0);
  
  // 黒色ピクセル（背景）を透明化処理
  const imgData = plantCtx.getImageData(0, 0, rawImg.width, rawImg.height);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i] < 20 && data[i+1] < 20 && data[i+2] < 20) {
      data[i+3] = 0;
    }
  }
  plantCtx.putImageData(imgData, 0, 0);
  plantImgLoaded = true;
};

</script>
</body>
</html>
