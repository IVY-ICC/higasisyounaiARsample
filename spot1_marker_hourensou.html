<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>スポット1 マーカーAR ほうれんそうばたけ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: #000 !important;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }

  a-scene { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }
  video {
    position: fixed !important; top:0 !important; left:0 !important;
    width:100% !important; height:100% !important;
    object-fit: cover !important; z-index:0 !important;
  }

  #searchHint {
    position:fixed; bottom:0; left:0; width:100%; z-index:20;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color:#fff; text-align:center; pointer-events:none;
  }
  #searchHint .badge {
    display:inline-block; background: rgba(0,0,0,0.5);
    border:2px solid rgba(255,255,255,0.6); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:20;
    padding: 16px 18px; padding-top: max(16px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:4px; }

  #gameLayer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:30; display:none; }
  #gameCanvas { position:fixed; top:0; left:0; width:100%; height:100%; touch-action:none; }

  #questionBox {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    z-index:31; width:90%; max-width:380px; display:none;
    background:rgba(255,255,255,0.95); color:#1f3a24; border-radius:18px;
    padding:16px 18px; text-align:center; font-weight:700; font-size:16px;
    line-height:1.6; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }
  #pullCount { color:#2e8b47; font-size:19px; display:block; margin-top:4px; }

  #hint {
    position:fixed; bottom:0; left:0; width:100%; z-index:31;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(0,0,0,0.5);
    border:2px solid rgba(255,255,255,0.6); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #choices {
    position:fixed; bottom:0; left:0; width:100%; z-index:32;
    padding: 18px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    display:none; gap:12px; flex-direction:column;
    background: linear-gradient(transparent, rgba(0,0,0,0.8) 30%);
  }
  #choices.show { display:flex; }
  .choiceBtn {
    background:#fff; color:#1f3a24; border:none; border-radius:16px;
    padding:16px; font-size:18px; font-weight:800;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .choiceBtn.wrong { background:#ffe3e3; color:#d93025; }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #2b8a5f, #1c5e3f); z-index:40;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.4s ease; }
  #clearScreen .stamp {
    width:130px; height:130px; border-radius:50%;
    background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:60px; margin-bottom:20px; box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  #clearScreen h2 { font-size:24px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.8; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット1・ほうれんそうばたけ</p>
</div>

<div id="searchHint">
  <div class="badge" id="searchMsg">印刷したマーカーに カメラを むけてね</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./hourenso.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<div id="gameLayer">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="questionBox">
  ほうれんそうを 3束 しゅうかくしよう。<br>
  うえに ひっぱって ぬいてね!
  <span id="pullCount">ぬいた数：0 / 3</span>
</div>

<div id="hint">
  <div class="badge" id="hintText">ほうれんそうを 上にひっぱろう</div>
</div>

<div id="choices">
  <button class="choiceBtn" data-val="6">6つ</button>
  <button class="choiceBtn" data-val="3">3つ</button>
  <button class="choiceBtn" data-val="9">9つ</button>
</div>

<div id="clearScreen">
  <div class="stamp">🥬</div>
  <h2>せいかい!</h2>
  <p id="clearText"></p>
</div>

<script>
const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const searchMsg = document.getElementById('searchMsg');
const gameLayer = document.getElementById('gameLayer');
const questionBox = document.getElementById('questionBox');
const hint = document.getElementById('hint');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const pullCountEl = document.getElementById('pullCount');
const choicesBox = document.getElementById('choices');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

let W, H;
let plants = [];
let pulledCount = 0;
const PULL_TARGET = 3;
let phase = 'pulling';
let answered = false;
let gameStarted = false;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  if(plants.length === 0) initPlants();
}
window.addEventListener('resize', () => {
  resize();
  const scene = document.querySelector('a-scene');
  if (scene && scene.resize) scene.resize();
});

function initPlants(){
  plants = [];
  const positions = [
    {x:0.25, y:0.45}, {x:0.5, y:0.42}, {x:0.75, y:0.45},
    {x:0.35, y:0.65}, {x:0.65, y:0.65}
  ];
  positions.forEach(pos => {
    plants.push({
      x: W * pos.x,
      y: H * pos.y,
      size: Math.min(W, H) * 0.18,
      pulled: false,
      offsetY: 0
    });
  });
}

let activePlant = null;
let startY = 0;

function pointerPos(e){
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function handleStart(x, y){
  if(phase !== 'pulling') return;
  plants.forEach(p => {
    if(!p.pulled && Math.hypot(x - p.x, y - (p.y + p.offsetY)) < p.size * 1.2){
      activePlant = p;
      startY = y;
    }
  });
}

function handleMove(y){
  if(!activePlant) return;
  const dy = startY - y;
  if(dy > 0){
    activePlant.offsetY = -dy;
    if(dy > 70){
      activePlant.pulled = true;
      activePlant = null;
      pulledCount++;
      pullCountEl.textContent = `ぬいた数：${pulledCount} / ${PULL_TARGET}`;
      
      if(pulledCount >= PULL_TARGET){
        phase = 'quiz';
        setTimeout(() => {
          questionBox.innerHTML = 'ほうれんそうは 1ねんに<br>なんかい しゅうかくできるかな？';
          hint.style.display = 'none';
          choicesBox.classList.add('show');
        }, 400);
      }
    }
  }
}

function handleEnd(){
  if(activePlant){
    activePlant.offsetY = 0;
    activePlant = null;
  }
}

canvas.addEventListener('touchstart', e => { const p = pointerPos(e); handleStart(p.x, p.y); }, {passive:true});
canvas.addEventListener('touchmove', e => { const p = pointerPos(e); handleMove(p.y); }, {passive:true});
canvas.addEventListener('touchend', handleEnd);
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => { if(e.buttons === 1) handleMove(e.clientY); });
canvas.addEventListener('mouseup', handleEnd);

function drawSpinach(x, y, size){
  ctx.save();
  ctx.translate(x, y);
  
  // 根元
  ctx.fillStyle = '#e8f5e9';
  ctx.beginPath();
  ctx.arc(0, size*0.3, size*0.15, 0, Math.PI*2);
  ctx.fill();

  // 葉っぱ
  ctx.fillStyle = '#2e7d32';
  for(let i=0; i<5; i++){
    const angle = (i - 2) * 0.4 - Math.PI/2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(angle)*size*0.3, Math.sin(angle)*size*0.3, size*0.25, size*0.45, angle + Math.PI/2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  plants.forEach(p => {
    if(!p.pulled){
      drawSpinach(p.x, p.y + p.offsetY, p.size);
    }
  });
  requestAnimationFrame(draw);
}

document.querySelectorAll('.choiceBtn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    if(answered) return;
    const val = e.target.getAttribute('data-val');
    if(val === '3'){
      answered = true;
      clearText.innerHTML = 'せいかい！<br>ほうれんそうは 1ねんに 3かいもしゅうかくできるんだよ！';
      clearScreen.classList.add('show');
    } else {
      e.target.classList.add('wrong');
      setTimeout(() => e.target.classList.remove('wrong'), 800);
    }
  });
});

// マーカー検出処理
targetEntity.addEventListener('targetFound', () => {
  searchHint.style.display = 'none';
  if(!gameStarted){
    gameStarted = true;
    resize();
    gameLayer.style.display = 'block';
    questionBox.style.display = 'block';
    hint.style.display = 'block';
    requestAnimationFrame(draw);
  }
});

targetEntity.addEventListener('targetLost', () => {
  if(!gameStarted) searchHint.style.display = 'block';
});

// MindARの読み込みエラー検知
const sceneEl = document.querySelector('a-scene');
sceneEl.addEventListener('arError', (event) => {
  searchMsg.textContent = 'エラー: hourenso.mind が読み込めません';
  searchMsg.style.color = '#ff8a8a';
});
</script>
</body>
</html>
