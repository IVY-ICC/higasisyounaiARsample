<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット8 マーカーAR ゆふだけの ちず</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background: transparent !important;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }
  a-scene { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; background: transparent !important; }
  video {
    position: fixed !important; top:0 !important; left:0 !important;
    width:100% !important; height:100% !important;
    object-fit: cover !important; z-index:-1 !important;
  }

  #searchHint {
    position:fixed; bottom:0; left:0; width:100%; z-index:20;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
    color:#fff; text-align:center; pointer-events:none;
  }
  #searchHint .badge {
    display:inline-block; background: rgba(0,0,0,0.4);
    border:2px solid rgba(255,255,255,0.6); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:20;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:2px; }

  #gameLayer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:30; display:none; }
  #mapCanvas { position:fixed; top:0; left:0; width:100%; height:100%; touch-action:none; z-index:30; }

  #progressBarWrap {
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    width:70%; max-width:300px; height:14px; border-radius:8px;
    background:rgba(255,255,255,0.3); z-index:31; display:none; overflow:hidden;
    border:2px solid rgba(255,255,255,0.6);
  }
  #progressBarFill { height:100%; width:0%; background:#7ee08c; transition: width 0.1s linear; }

  #hint {
    position:fixed; bottom:0; left:0; width:100%; z-index:31;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(0,0,0,0.4);
    border:2px solid rgba(255,255,255,0.5); border-radius:24px;
    padding:10px 22px; font-size:16px; font-weight:600; backdrop-filter: blur(6px);
  }

  #quizBox {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    z-index:31; width:90%; max-width:380px; display:none;
    background:rgba(255,255,255,0.92); color:#3a2410; border-radius:16px;
    padding:14px 18px; text-align:center; font-weight:700; font-size:14px;
    line-height:1.7; box-shadow:0 6px 20px rgba(0,0,0,0.3); backdrop-filter: blur(4px);
  }
  #choices {
    position:fixed; bottom:0; left:0; width:100%; z-index:32;
    padding: 18px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    display:none; gap:12px; flex-direction:column;
    background: linear-gradient(transparent, rgba(0,0,0,0.75) 30%);
  }
  #choices.show { display:flex; }
  .choiceBtn { background:#fff; color:#3a2410; border:3px solid #fff; border-radius:20px; padding:16px; font-size:18px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,0.25); }
  .choiceBtn.wrong { background:#ffe3e3; border-color:#ff8a8a; }
  .choiceBtn.correct { background:#d6f5e0; border-color:#3fbf7f; }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(28, 94, 63, 0.92); z-index:40; backdrop-filter: blur(4px);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp { width:130px; height:130px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:22px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #clearScreen h2 { font-size:24px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット8・ゆふだけの ちず</p>
</div>

<div id="searchHint">
  <div class="badge">印刷したマーカーに カメラを むけてね</div>
</div>

<!-- ★ imageTargetSrc は実際の.mindファイル名に書き換えてください -->
<a-scene
  mindar-image="imageTargetSrc: ./yufudake_v2.mind; autoStart: true; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<div id="gameLayer">
  <canvas id="mapCanvas"></canvas>
</div>

<div id="progressBarWrap"><div id="progressBarFill"></div></div>

<div id="quizBox">
  由布岳(ゆふだけ)は 2つの 峰(みね)を もつ 山だよ。<br>
  西峰(にしみね)と 東峰(ひがしみね)、たかいのは どちら?
</div>

<div id="hint">
  <div class="badge" id="hintText">がめんを うえに なぞろう</div>
</div>

<div id="choices">
  <button class="choiceBtn" data-val="nishi">西峰(にしみね)</button>
  <button class="choiceBtn" data-val="higashi">東峰(ひがしみね)</button>
</div>

<div id="clearScreen">
  <div class="stamp">⛰️</div>
  <h2>やまが できた!</h2>
  <p id="clearText"></p>
</div>

<script>
const targetEntity = document.getElementById('target');
const searchHint = document.getElementById('searchHint');
const gameLayer = document.getElementById('gameLayer');
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const progressBarWrap = document.getElementById('progressBarWrap');
const progressBarFill = document.getElementById('progressBarFill');
const quizBox = document.getElementById('quizBox');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const choicesBox = document.getElementById('choices');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

let W, H;
let progress = 0;
let phase = 'scroll'; // scroll -> quiz -> done
let answered = false;
let gameStarted = false;
let loopRunning = false;

const LAYER_COUNT = 6;
let layers = [];

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  buildLayers();
}
window.addEventListener('resize', resize);

function buildLayers(){
  layers = [];
  const baseCx = W * 0.5;
  const baseCy = H * 0.58;
  const baseRx = Math.min(W, H) * 0.32;
  const baseRy = baseRx * 0.55;
  const colors = ['#3f8f4f', '#5fa85f', '#8cb35a', '#b3924a', '#8f6a4a', '#f4f4f4'];

  for (let i=0; i<LAYER_COUNT; i++){
    const t = i / (LAYER_COUNT - 1);
    const scale = 1 - t * 0.78;
    const liftY = t * baseRy * 2.1;
    layers.push({
      cx: baseCx, cy: baseCy - liftY,
      rx: baseRx * scale, ry: baseRy * scale,
      color: colors[i], revealAt: i / LAYER_COUNT, seed: i * 12.9898
    });
  }
}

function drawContourShape(layer, riseAmount){
  const points = 18;
  ctx.beginPath();
  for (let i=0; i<=points; i++){
    const angle = (i / points) * Math.PI * 2;
    const noise = Math.sin(angle * 3 + layer.seed) * 0.08 + Math.sin(angle * 5 + layer.seed*1.7) * 0.05;
    const rx = layer.rx * (1 + noise);
    const ry = layer.ry * (1 + noise);
    const x = layer.cx + Math.cos(angle) * rx;
    const y = (layer.cy - riseAmount) + Math.sin(angle) * ry;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

let dragging = false;
let lastY = 0;
function onDragStart(y){ dragging = true; lastY = y; }
function onDragMove(y){
  if (!dragging || phase !== 'scroll') return;
  const delta = lastY - y;
  lastY = y;
  if (delta > 0){
    progress = Math.min(1, progress + delta / (H * 0.9));
    updateProgressUI();
    if (progress >= 1){
      phase = 'quiz';
      hintText.textContent = 'クイズに こたえよう';
      quizBox.style.display = 'block';
      setTimeout(()=>{ choicesBox.classList.add('show'); }, 400);
    }
  }
}
function onDragEnd(){ dragging = false; }

canvas.addEventListener('touchstart', e=>{ onDragStart(e.touches[0].clientY); }, {passive:true});
canvas.addEventListener('touchmove', e=>{ onDragMove(e.touches[0].clientY); }, {passive:true});
canvas.addEventListener('touchend', onDragEnd);
canvas.addEventListener('mousedown', e=>{ onDragStart(e.clientY); });
window.addEventListener('mousemove', e=>{ if(dragging) onDragMove(e.clientY); });
window.addEventListener('mouseup', onDragEnd);

function updateProgressUI(){
  progressBarFill.style.width = Math.round(progress*100) + '%';
  if (progress < 0.3) hintText.textContent = 'がめんを うえに なぞろう';
  else if (progress < 0.7) hintText.textContent = 'やまが たかく なってきた!';
  else if (progress < 1) hintText.textContent = 'あと すこし!';
}

choicesBox.addEventListener('click', (e)=>{
  const btn = e.target.closest('.choiceBtn');
  if (!btn || answered) return;
  if (btn.dataset.val === 'nishi'){
    answered = true;
    btn.classList.add('correct');
    hintText.textContent = 'せいかい!';
    setTimeout(()=>{
      phase = 'done';
      clearText.innerHTML = '由布岳の西峰は 1,583m、東峰は 1,580m。<br>わずか 3mの さで、西峰の ほうが たかいんだよ。<br>とうこうせん(等高線)を かさねると、<br>やまの たかさが よく わかるね!';
      clearScreen.classList.add('show');
    }, 700);
  } else {
    btn.classList.add('wrong');
    hintText.textContent = 'ちがうよ、もういちど かんがえてみよう';
    setTimeout(()=> btn.classList.remove('wrong'), 700);
  }
});

function loop(){
  if (!loopRunning) return;
  ctx.clearRect(0,0,W,H);
  layers.forEach((layer)=>{
    const localT = (progress - layer.revealAt) / (1/LAYER_COUNT);
    const clamped = Math.max(0, Math.min(1, localT));
    if (clamped <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamped;
    ctx.fillStyle = layer.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    drawContourShape(layer, (1-clamped) * 40);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });
  requestAnimationFrame(loop);
}

targetEntity.addEventListener('targetFound', () => {
  searchHint.style.display = 'none';
  if (!gameStarted){
    gameStarted = true;
    resize();
    gameLayer.style.display = 'block';
    progressBarWrap.style.display = 'block';
    hint.style.display = 'block';
    loopRunning = true;
    requestAnimationFrame(loop);
  }
});
targetEntity.addEventListener('targetLost', () => {
  if (!gameStarted) searchHint.style.display = 'block';
});
</script>
</body>
</html>
