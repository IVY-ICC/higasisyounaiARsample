<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット3 迷路「おいけへの みち」</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }

  #camera { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; display:none; }
  #overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; display:none; }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:10;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.65), transparent);
    color:#fff; pointer-events:none; display:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.9; margin-top:2px; }

  #letterBox {
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    z-index:11; display:none; gap:10px;
  }
  #letterBox .slot {
    width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800;
    color:#8a5a2a; box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  #letterBox .slot.filled { background:#ffe9b8; }

  /* ---- 方向ボタン ---- */
  #controls {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:12; display:none;
    width:170px; height:170px;
  }
  .ctrlBtn {
    position:absolute; width:52px; height:52px; border-radius:14px;
    background:rgba(255,255,255,0.85); border:none; font-size:22px; font-weight:800;
    color:#4a3a1a; box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  .ctrlBtn:active { background:#ffe9b8; }
  #btnUp { top:0; left:59px; }
  #btnDown { bottom:0; left:59px; }
  #btnLeft { top:59px; left:0; }
  #btnRight { top:59px; right:0; }

  #hint {
    position:fixed; bottom:0; left:0; width:100%; z-index:10;
    padding: 16px; padding-bottom: max(210px, calc(env(safe-area-inset-bottom) + 200px));
    background: linear-gradient(transparent, rgba(0,0,0,0.5));
    color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(255,255,255,0.2);
    border:2px solid rgba(255,255,255,0.45); border-radius:24px;
    padding:8px 18px; font-size:14px; font-weight:600; backdrop-filter: blur(6px);
  }

  #startScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #4a9a6a, #256b45);
    z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #startScreen .num { background:#fff; color:#256b45; font-weight:800; font-size:15px; border-radius:20px; padding:5px 18px; margin-bottom:14px; }
  #startScreen .icon { font-size:64px; margin-bottom:14px; }
  #startScreen h2 { font-size:24px; margin-bottom:12px; font-weight:800; }
  #startScreen p { font-size:15px; opacity:0.95; line-height:1.85; max-width:310px; margin-bottom:28px; }
  #startBtn { background:#fff; color:#256b45; border:none; border-radius:32px; padding:18px 44px; font-size:18px; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
  #errBox { display:none; margin-top:18px; font-size:13px; color:#fff; background:rgba(0,0,0,0.25); padding:12px 16px; border-radius:14px; max-width:290px; line-height:1.7; }
  #loadingBox { display:none; margin-top:16px; font-size:14px; }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #2b8a5f, #1c5e3f); z-index:50;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp { width:140px; height:140px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:64px; margin-bottom:22px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #clearScreen h2 { font-size:26px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="startScreen">
  <div class="num">スポット 3 / 9</div>
  <div class="icon">💧</div>
  <h2>おいけへの みち</h2>
  <p>めいろを すすんで、もじを 3つ あつめよう。<br>あつめた もじで たからばこが ひらくよ!</p>
  <button id="startBtn">しゃしんを とる</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
  <div id="errBox"></div>
  <div id="loadingBox">よみこみちゅう…</div>
</div>

<img id="camera" alt="とったしゃしん">
<canvas id="overlay"></canvas>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット3・おいけへの みち</p>
</div>

<div id="letterBox">
  <div class="slot" id="slot0"></div>
  <div class="slot" id="slot1"></div>
  <div class="slot" id="slot2"></div>
</div>

<div id="hint">
  <div class="badge" id="hintText">ボタンで すすんで、もじを あつめよう</div>
</div>

<div id="controls">
  <button class="ctrlBtn" id="btnUp">▲</button>
  <button class="ctrlBtn" id="btnLeft">◀</button>
  <button class="ctrlBtn" id="btnRight">▶</button>
  <button class="ctrlBtn" id="btnDown">▼</button>
</div>

<div id="clearScreen">
  <div class="stamp">💧</div>
  <h2>たからばこが ひらいた!</h2>
  <p id="clearText"></p>
</div>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const errBox = document.getElementById('errBox');
const loadingBox = document.getElementById('loadingBox');
const fileInput = document.getElementById('fileInput');
const ui = document.getElementById('ui');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const letterBox = document.getElementById('letterBox');
const controls = document.getElementById('controls');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

let W, H;
const COLS = 5, ROWS = 6;
let cellSize, offsetX, offsetY;
let cells = []; // cells[row][col] = {top,right,bottom,left,visited}
let player = { row:0, col:0 };
let goal = { row: ROWS-1, col: COLS-1 };
let letterCells = []; // [{row,col,char, collected}]
let collectedOrder = [];
const TARGET_WORD = ['お','い','け'];
let cleared = false;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  const mazeW = W * 0.86;
  const mazeH = H * 0.56;
  cellSize = Math.min(mazeW/COLS, mazeH/ROWS);
  offsetX = (W - cellSize*COLS)/2;
  offsetY = H*0.24;
}
window.addEventListener('resize', resize);

// ---- 迷路生成（再帰バックトラッカー法で「一本道」の完全迷路を作る） ----
function generateMaze(){
  cells = [];
  for (let r=0;r<ROWS;r++){
    const row = [];
    for (let c=0;c<COLS;c++){
      row.push({top:true,right:true,bottom:true,left:true,visited:false});
    }
    cells.push(row);
  }

  const stack = [];
  let cur = {row:0,col:0};
  cells[0][0].visited = true;
  stack.push(cur);
  const parentPath = {}; // key "r,c" -> parent "r,c"

  function key(r,c){ return r+','+c; }
  function neighbors(r,c){
    const list = [];
    if (r>0 && !cells[r-1][c].visited) list.push({row:r-1,col:c,dir:'top'});
    if (r<ROWS-1 && !cells[r+1][c].visited) list.push({row:r+1,col:c,dir:'bottom'});
    if (c>0 && !cells[r][c-1].visited) list.push({row:r,col:c-1,dir:'left'});
    if (c<COLS-1 && !cells[r][c+1].visited) list.push({row:r,col:c+1,dir:'right'});
    return list;
  }
  const opposite = {top:'bottom',bottom:'top',left:'right',right:'left'};

  while (stack.length){
    cur = stack[stack.length-1];
    const nbrs = neighbors(cur.row, cur.col);
    if (nbrs.length === 0){ stack.pop(); continue; }
    const next = nbrs[Math.floor(Math.random()*nbrs.length)];
    cells[cur.row][cur.col][next.dir] = false;
    cells[next.row][next.col][opposite[next.dir]] = false;
    cells[next.row][next.col].visited = true;
    parentPath[key(next.row,next.col)] = key(cur.row,cur.col);
    stack.push({row:next.row, col:next.col});
  }

  // start(0,0) -> goal の経路を再構築（完全迷路なので唯一の道）
  let path = [];
  let k = key(goal.row, goal.col);
  while (k !== undefined){
    const [r,c] = k.split(',').map(Number);
    path.push({row:r,col:c});
    k = parentPath[k];
  }
  path.reverse(); // start -> goal 順

  // 経路の1/4, 1/2, 3/4あたりの地点に「お」「い」「け」を配置
  const idxs = [
    Math.max(1, Math.floor(path.length*0.28)),
    Math.floor(path.length*0.55),
    Math.max(path.length-2, Math.floor(path.length*0.8))
  ];
  letterCells = idxs.map((idx,i)=>({
    row: path[idx].row, col: path[idx].col, char: TARGET_WORD[i], collected:false
  }));
}

startBtn.addEventListener('click', ()=>{ fileInput.click(); });

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  loadingBox.style.display = 'block';
  errBox.style.display = 'none';

  const reader = new FileReader();
  reader.onload = (ev)=>{
    video.onload = ()=>{
      loadingBox.style.display = 'none';
      startScreen.style.display = 'none';
      video.style.display = 'block';
      canvas.style.display = 'block';
      ui.style.display = 'block';
      hint.style.display = 'block';
      letterBox.style.display = 'flex';
      controls.style.display = 'block';
      generateMaze();
      player = {row:0, col:0};
      resize();
      requestAnimationFrame(loop);
    };
    video.onerror = showLoadError;
    video.src = ev.target.result;
  };
  reader.onerror = showLoadError;
  reader.readAsDataURL(file);
});

function showLoadError(){
  loadingBox.style.display = 'none';
  errBox.style.display = 'block';
  errBox.textContent = 'しゃしんが よみこめなかったよ。もういちど とってみてね。';
}

function tryMove(dr, dc, wallDir){
  if (cleared) return;
  const r = player.row, c = player.col;
  const cell = cells[r][c];
  if (cell[wallDir]) return; // 壁があれば進めない
  const nr = r+dr, nc = c+dc;
  if (nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  player = {row:nr, col:nc};
  checkLetterPickup();
  checkGoal();
}

function checkLetterPickup(){
  for (const lc of letterCells){
    if (!lc.collected && lc.row===player.row && lc.col===player.col){
      lc.collected = true;
      collectedOrder.push(lc.char);
      const idx = collectedOrder.length-1;
      const slot = document.getElementById('slot'+idx);
      if (slot){ slot.textContent = lc.char; slot.classList.add('filled'); }
      hintText.textContent = '「' + lc.char + '」を ゲット!';
    }
  }
}

function checkGoal(){
  if (player.row===goal.row && player.col===goal.col && collectedOrder.length===3){
    cleared = true;
    hintText.textContent = 'たからばこに たどりついた!';
    setTimeout(()=>{
      clearText.innerHTML = '「おいけ」は くろだけの ふもとに ある わきみずだよ。<br>すきとおった あおい みずで、<br>1年じゅう 12どぐらいの つめたさなんだ。<br>「日本 名水百選」にも えらばれているよ。';
      clearScreen.classList.add('show');
    }, 600);
  } else if (player.row===goal.row && player.col===goal.col){
    hintText.textContent = 'もじを ぜんぶ あつめてから ゴールしよう';
  }
}

document.getElementById('btnUp').addEventListener('click', ()=> tryMove(-1,0,'top'));
document.getElementById('btnDown').addEventListener('click', ()=> tryMove(1,0,'bottom'));
document.getElementById('btnLeft').addEventListener('click', ()=> tryMove(0,-1,'left'));
document.getElementById('btnRight').addEventListener('click', ()=> tryMove(0,1,'right'));

function drawMaze(){
  ctx.save();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // 背景の半透明パネル
  ctx.fillStyle = 'rgba(20,30,25,0.55)';
  ctx.fillRect(offsetX-14, offsetY-14, cellSize*COLS+28, cellSize*ROWS+28);

  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const x = offsetX + c*cellSize;
      const y = offsetY + r*cellSize;
      const cell = cells[r][c];
      ctx.beginPath();
      if (cell.top){ ctx.moveTo(x,y); ctx.lineTo(x+cellSize,y); }
      if (cell.right){ ctx.moveTo(x+cellSize,y); ctx.lineTo(x+cellSize,y+cellSize); }
      if (cell.bottom){ ctx.moveTo(x,y+cellSize); ctx.lineTo(x+cellSize,y+cellSize); }
      if (cell.left){ ctx.moveTo(x,y); ctx.lineTo(x,y+cellSize); }
      ctx.stroke();
    }
  }

  // スタート・ゴール表示
  ctx.font = `${cellSize*0.4}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('S', offsetX+cellSize*0.5, offsetY+cellSize*0.5);
  ctx.fillText('💧', offsetX+cellSize*(goal.col+0.5), offsetY+cellSize*(goal.row+0.5));

  // 文字マス
  for (const lc of letterCells){
    if (lc.collected) continue;
    ctx.fillStyle = 'rgba(255,214,107,0.95)';
    ctx.beginPath();
    ctx.arc(offsetX+cellSize*(lc.col+0.5), offsetY+cellSize*(lc.row+0.5), cellSize*0.32, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5a3a10';
    ctx.font = `bold ${cellSize*0.42}px sans-serif`;
    ctx.fillText(lc.char, offsetX+cellSize*(lc.col+0.5), offsetY+cellSize*(lc.row+0.5));
  }

  // プレイヤー
  ctx.fillStyle = '#ff5c5c';
  ctx.beginPath();
  ctx.arc(offsetX+cellSize*(player.col+0.5), offsetY+cellSize*(player.row+0.5), cellSize*0.28, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawMaze();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
