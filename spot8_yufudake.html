<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スポット8 ゆふだけの クイズ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: "UD Digi Kyokasho NP-R", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }

  #camera { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; display:none; }
  #three-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; touch-action:none; display:none; }

  #ui {
    position:fixed; top:0; left:0; width:100%; z-index:10;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    color:#fff; pointer-events:none; display:none;
  }
  #ui h1 { font-size:16px; font-weight:700; }
  #ui p { font-size:12px; opacity:0.85; margin-top:2px; }

  #hint {
    position:fixed; bottom:0; left:0; width:100%; z-index:10;
    padding: 22px; padding-bottom: max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    color:#fff; text-align:center; pointer-events:none; display:none;
  }
  #hint .badge {
    display:inline-block; background: rgba(0,0,0,0.45);
    border:2px solid rgba(255,255,255,0.5); border-radius:24px;
    padding:10px 22px; font-size:15px; font-weight:600; backdrop-filter: blur(6px);
  }

  #questionBox {
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    z-index:11; width:90%; max-width:400px; display:none;
    background:rgba(255,255,255,0.95); color:#1a3a2a; border-radius:18px;
    padding:14px 18px; text-align:center; font-weight:700; font-size:14px;
    line-height:1.7; box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }

  #choices {
    position:fixed; bottom:0; left:0; width:100%; z-index:12;
    padding: 18px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    display:none; gap:12px; flex-direction:column;
    background: linear-gradient(transparent, rgba(0,0,0,0.75) 30%);
  }
  #choices.show { display:flex; }
  .choiceBtn {
    background:#fff; color:#1a3a2a; border:3px solid #fff; border-radius:20px;
    padding:16px; font-size:18px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .choiceBtn.wrong { background:#ffd9d9; border-color:#ff8a8a; }
  .choiceBtn.correct { background:#d6f5e0; border-color:#3fbf7f; }

  #startScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #6fae7a, #2f6b3f);
    z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #startScreen .num { background:#fff; color:#2f6b3f; font-weight:800; font-size:15px; border-radius:20px; padding:5px 18px; margin-bottom:14px; }
  #startScreen .icon { font-size:64px; margin-bottom:14px; }
  #startScreen h2 { font-size:24px; margin-bottom:12px; font-weight:800; }
  #startScreen p { font-size:15px; opacity:0.95; line-height:1.85; max-width:310px; margin-bottom:28px; }
  #startBtn { background:#fff; color:#2f6b3f; border:none; border-radius:32px; padding:18px 44px; font-size:18px; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
  #errBox { display:none; margin-top:18px; font-size:13px; color:#fff; background:rgba(0,0,0,0.25); padding:12px 16px; border-radius:14px; max-width:290px; line-height:1.7; }
  #loadingBox { display:none; margin-top:16px; font-size:14px; }

  #clearScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(160deg, #2b8a5f, #1c5e3f); z-index:50;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:26px;
  }
  #clearScreen.show { display:flex; animation: fadeIn 0.5s ease; }
  #clearScreen .stamp { width:140px; height:140px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:64px; margin-bottom:22px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #clearScreen h2 { font-size:26px; margin-bottom:10px; font-weight:800; }
  #clearScreen p { font-size:15px; opacity:0.95; max-width:290px; line-height:1.9; }
  @keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>

<div id="startScreen">
  <div class="num">スポット 8 / 9</div>
  <div class="icon">⛰️</div>
  <h2>ゆふだけの クイズ</h2>
  <p>しゃしんを とると、目の前に<br>由布岳(ゆふだけ)の 3Dもけいが あらわれるよ。<br>ゆびで うごかして、いろんな 角度から 見てみよう!</p>
  <button id="startBtn">しゃしんを とる</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
  <div id="errBox"></div>
  <div id="loadingBox">よみこみちゅう…</div>
</div>

<img id="camera" alt="とったしゃしん" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1;">
<canvas id="three-canvas"></canvas>

<div id="ui">
  <h1>由布市ARスタンプラリー</h1>
  <p>スポット8・ゆふだけ</p>
</div>

<div id="questionBox">
  由布岳(ゆふだけ)は 2つの峰(耳)を持つ<br>
  「双耳峰(そうじほう)」だよ。<br>
  西峰(にしみね)と 東峰(ひがしみね)、<br>
  標高(ひょうこう)が 高いのは どちら?
</div>

<div id="hint">
  <div class="badge" id="hintText">3Dもけいを うえから見ると、とうこうせんが 見えるよ</div>
</div>

<div id="choices">
  <button class="choiceBtn" data-val="west">西峰(にしみね)</button>
  <button class="choiceBtn" data-val="east">東峰(ひがしみね)</button>
</div>

<div id="clearScreen">
  <div class="stamp">⛰️</div>
  <h2>せいかい!</h2>
  <p id="clearText"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const video = document.getElementById('camera');
const canvas3d = document.getElementById('three-canvas');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const errBox = document.getElementById('errBox');
const loadingBox = document.getElementById('loadingBox');
const fileInput = document.getElementById('fileInput');
const ui = document.getElementById('ui');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const questionBox = document.getElementById('questionBox');
const choicesBox = document.getElementById('choices');
const clearScreen = document.getElementById('clearScreen');
const clearText = document.getElementById('clearText');

let scene, camera, renderer, mountainGroup;
let answered = false;
let hasLookedFromTop = false;
let rotX = -0.5, rotY = 0.3;
let dragging = false;
let lastX = 0, lastY = 0;

startBtn.addEventListener('click', ()=>{ fileInput.click(); });

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  loadingBox.style.display = 'block';
  errBox.style.display = 'none';

  const reader = new FileReader();
  reader.onload = (ev)=>{
    video.onload = ()=>{
      loadingBox.style.display = 'none';
      startScreen.style.display = 'none';
      video.style.display = 'block';
      canvas3d.style.display = 'block';
      ui.style.display = 'block';
      hint.style.display = 'block';
      questionBox.style.display = 'block';
      initThree();
    };
    video.onerror = showLoadError;
    video.src = ev.target.result;
  };
  reader.onerror = showLoadError;
  reader.readAsDataURL(file);
});

function showLoadError(){
  loadingBox.style.display = 'none';
  errBox.style.display = 'block';
  errBox.textContent = 'しゃしんが よみこめなかったよ。もういちど とってみてね。';
}

// 由布岳の双耳峰＋等高線模型をThree.jsで作る
function buildMountain(){
  const group = new THREE.Group();

  // 山体（東峰・西峰の2つの円錐を重ねて双耳峰に）
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a8f5a, roughness: 0.8 });
  const westPeak = new THREE.Mesh(new THREE.ConeGeometry(1.3, 2.1, 32), bodyMat); // 西峰：やや高い
  westPeak.position.set(-0.55, 1.05, 0);
  group.add(westPeak);

  const eastPeak = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.0, 32), bodyMat); // 東峰：やや低い
  eastPeak.position.set(0.55, 1.0, 0);
  group.add(eastPeak);

  // 山裾をつなぐ土台
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x3f7a4f, roughness: 0.9 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.6, 0.6, 40), baseMat);
  base.position.y = -0.1;
  group.add(base);

  // 等高線（水平方向のリング）を複数の高さに配置
  const ringMat = new THREE.LineBasicMaterial({ color: 0xffffff });
  const heights = [0.3, 0.7, 1.1, 1.5, 1.9];
  heights.forEach(h=>{
    const radius = 2.0 * (1 - h/2.4);
    const pts = [];
    for (let i=0;i<=64;i++){
      const a = (i/64) * Math.PI*2;
      // 西側をやや大きく（西峰が高いことを反映した非対称な等高線）
      const rx = radius * (1 + (Math.cos(a)<0 ? 0.15 : 0));
      pts.push(new THREE.Vector3(Math.cos(a)*rx, h, Math.sin(a)*radius*0.9));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const ring = new THREE.LineLoop(geo, ringMat);
    group.add(ring);
  });

  return group;
}

function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.4, 5);
  camera.lookAt(0, 0.6, 0);

  renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(3, 5, 2);
  scene.add(dir);

  mountainGroup = buildMountain();
  scene.add(mountainGroup);

  canvas3d.addEventListener('touchstart', e=>{ const t=e.touches[0]; dragging=true; lastX=t.clientX; lastY=t.clientY; }, {passive:true});
  canvas3d.addEventListener('touchmove', e=>{
    if (!dragging) return;
    const t = e.touches[0];
    rotY += (t.clientX - lastX) * 0.01;
    rotX += (t.clientY - lastY) * 0.01;
    rotX = Math.max(-1.5, Math.min(0.1, rotX));
    lastX = t.clientX; lastY = t.clientY;
    checkTopView();
  }, {passive:true});
  canvas3d.addEventListener('touchend', ()=>{ dragging=false; });

  canvas3d.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mousemove', e=>{
    if (!dragging) return;
    rotY += (e.clientX - lastX) * 0.01;
    rotX += (e.clientY - lastY) * 0.01;
    rotX = Math.max(-1.5, Math.min(0.1, rotX));
    lastX = e.clientX; lastY = e.clientY;
    checkTopView();
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; });

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function checkTopView(){
  // ほぼ真上から見た状態になったら、等高線を見つけたヒントを出す
  if (!hasLookedFromTop && rotX < -1.1){
    hasLookedFromTop = true;
    hintText.textContent = 'とうこうせんを 見つけた!よく かんさつしてみよう';
    setTimeout(()=>{ choicesBox.classList.add('show'); }, 600);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const camDist = 5;
  camera.position.x = Math.sin(rotY) * camDist * Math.cos(rotX+1.2);
  camera.position.z = Math.cos(rotY) * camDist * Math.cos(rotX+1.2);
  camera.position.y = 2.4 + Math.sin(rotX+1.2) * camDist;
  camera.lookAt(0, 0.6, 0);
  renderer.render(scene, camera);
}

choicesBox.addEventListener('click', (e)=>{
  const btn = e.target.closest('.choiceBtn');
  if (!btn || answered) return;
  if (btn.dataset.val === 'west'){
    answered = true;
    btn.classList.add('correct');
    hintText.textContent = 'せいかい!';
    setTimeout(()=>{
      clearText.innerHTML = '西峰(にしみね)は 標高1,583m、<br>東峰(ひがしみね)は 標高1,580mで、<br>西峰の ほうが 3m たかいんだ。<br>由布岳は 大分県を だいひょうする 山だよ。';
      clearScreen.classList.add('show');
    }, 700);
  } else {
    btn.classList.add('wrong');
    hintText.textContent = 'ちがうよ、もういちど かんがえてみよう';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
});
</script>
</body>
</html>
